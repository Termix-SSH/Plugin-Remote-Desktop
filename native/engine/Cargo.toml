[package]
name = "termix-rd-engine"
version = "1.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ironrdp = { git = "https://github.com/Devolutions/IronRDP", rev = "1f69e124e6bf85608efce3495c12eaf5f6b5a95d", features = [
    "connector",
    "session",
    "input",
    "graphics",
    "dvc",
    "cliprdr",
    "rdpdr",
    "rdpsnd",
    "svc",
    "displaycontrol",
    "pdu",
    "vmconnect",
] }
ironrdp-core = { git = "https://github.com/Devolutions/IronRDP", rev = "1f69e124e6bf85608efce3495c12eaf5f6b5a95d", features = ["alloc"] }
ironrdp-pdu = { git = "https://github.com/Devolutions/IronRDP", rev = "1f69e124e6bf85608efce3495c12eaf5f6b5a95d" }
ironrdp-svc = { git = "https://github.com/Devolutions/IronRDP", rev = "1f69e124e6bf85608efce3495c12eaf5f6b5a95d" }
ironrdp-dvc = { git = "https://github.com/Devolutions/IronRDP", rev = "1f69e124e6bf85608efce3495c12eaf5f6b5a95d" }
ironrdp-cliprdr = { git = "https://github.com/Devolutions/IronRDP", rev = "1f69e124e6bf85608efce3495c12eaf5f6b5a95d" }
ironrdp-rdpdr = { git = "https://github.com/Devolutions/IronRDP", rev = "1f69e124e6bf85608efce3495c12eaf5f6b5a95d" }
ironrdp-rdpsnd = { git = "https://github.com/Devolutions/IronRDP", rev = "1f69e124e6bf85608efce3495c12eaf5f6b5a95d" }
ironrdp-displaycontrol = { git = "https://github.com/Devolutions/IronRDP", rev = "1f69e124e6bf85608efce3495c12eaf5f6b5a95d" }
ironrdp-graphics = { git = "https://github.com/Devolutions/IronRDP", rev = "1f69e124e6bf85608efce3495c12eaf5f6b5a95d" }
ironrdp-input = { git = "https://github.com/Devolutions/IronRDP", rev = "1f69e124e6bf85608efce3495c12eaf5f6b5a95d" }
ironrdp-rail = { git = "https://github.com/Devolutions/IronRDP", rev = "1f69e124e6bf85608efce3495c12eaf5f6b5a95d" }
ironrdp-egfx = { git = "https://github.com/Devolutions/IronRDP", rev = "1f69e124e6bf85608efce3495c12eaf5f6b5a95d" }

wasm-bindgen = "=0.2.104"
js-sys = "0.3"

png = "0.18"
jpeg-encoder = "0.6"
zune-jpeg = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

getrandom2 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom4 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
chrono = { version = "0.4", features = ["wasmbind"] }
time = { version = "0.3", features = ["wasm-bindgen"] }
web-time = "1.1"

tracing = { version = "0.1", features = ["log"] }
url = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
wasm-bindgen-test = "=0.3.54"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
